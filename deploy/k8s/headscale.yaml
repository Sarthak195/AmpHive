apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headscale-pvc
  namespace: amphive
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: amphive
data:
  config.yaml: |
    server_url: http://amphive-vpn.duckdns.org:8080
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 127.0.0.1:9090
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: true
    private_key_path: /var/lib/headscale/private.key
    noise:
      private_key_path: /var/lib/headscale/noise_private.key
    
    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
        write_ahead_log: true
    
    dns:
      magic_dns: true
      base_domain: amphive.mesh
      override_local_dns: true
      nameservers:
        global:
          - 1.1.1.1
          - 1.0.0.1
    
    derp:
      server:
        enabled: true
        region_id: 999
        region_code: "amphive-derp"
        region_name: "AmpHive Embedded DERP"
        stun_listen_addr: "0.0.0.0:3478"
        private_key_path: /var/lib/headscale/derp_server_private.key
      urls: []
      paths: []
      auto_update_enabled: true
      update_frequency: 24h
    
    ephemeral_node_inactivity_timeout: 30m
    prefixes:
      v4: 100.64.0.0/10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: amphive
  labels:
    app: headscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      containers:
        - name: headscale
          image: headscale/headscale:latest
          command: ["headscale", "serve"]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50443
              name: grpc
          volumeMounts:
            - name: headscale-data
              mountPath: /var/lib/headscale
            - name: config-volume
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
      volumes:
        - name: headscale-data
          persistentVolumeClaim:
            claimName: headscale-pvc
        - name: config-volume
          configMap:
            name: headscale-config
---
apiVersion: v1
kind: Service
metadata:
  name: headscale-service
  namespace: amphive
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 50443
      targetPort: 50443
      name: grpc
  selector:
    app: headscale
