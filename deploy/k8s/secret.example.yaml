# =============================================================================
# EXAMPLE ONLY — placeholder values. DO NOT commit real secrets.
#
# In practice you do NOT apply this file. Generate the real Secrets from the
# files deploy.ps1 already produces (see README "Create the secrets"):
#
#   # app env — one Secret from the existing .env (same keys the backend uses)
#   kubectl create secret generic amphive-env -n amphive --from-env-file=.env
#
#   # broker passwd + acl (generated on the VM by deploy.ps1)
#   kubectl create secret generic amphive-mqtt-auth -n amphive \
#     --from-file=passwd=./mosquitto_passwd \
#     --from-file=acl=./mosquitto_acl
#
#   # broker TLS material (deploy/config/mqtt-certs)
#   kubectl create secret generic amphive-mqtt-certs -n amphive \
#     --from-file=ca.crt=deploy/config/mqtt-certs/ca.crt \
#     --from-file=server.crt=deploy/config/mqtt-certs/server.crt \
#     --from-file=server.key=deploy/config/mqtt-certs/server.key
#
# The stringData block below just documents the KEYS amphive-env must contain
# (mirrors deploy/config/.env.template + docker-compose.tls.yml backend env).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: amphive-env
  namespace: amphive
type: Opaque
stringData:
  # --- Postgres (consumed by the postgres StatefulSet) ---
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "amphive"
  # --- Backend ---
  # Host MUST be `db` so it resolves to the headless Service.
  DATABASE_URL: "postgresql+asyncpg://postgres:REPLACE_ME@db:5432/amphive"
  JWT_SECRET_KEY: "REPLACE_ME_64_CHARS"
  MQTT_USERNAME: "REPLACE_ME"
  MQTT_PASSWORD: "REPLACE_ME"
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  COINS_PER_RUPEE: ""
  COINS_PER_KWH: ""
  MIN_START_BALANCE_COINS: ""
  PLATFORM_FEE_PCT: ""
  GST_RATE_PCT: ""
  TELEMETRY_RETENTION_DAYS: ""
  LOGIN_RATE_LIMIT: ""
  REGISTER_RATE_LIMIT: ""
  FORGOT_PASSWORD_RATE_LIMIT: ""
  RESET_PASSWORD_RATE_LIMIT: ""
  RESET_TOKEN_TTL_MIN: ""
  VAPID_PRIVATE_KEY: ""
  VAPID_SUBJECT: ""
  FRONTEND_ORIGIN: ""
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""
  RAZORPAY_WEBHOOK_SECRET: ""
  # --- Direct Mode (Tapo P110 via relay) ---
  DIRECT_MODE: ""
  TAPO_USERNAME: ""
  TAPO_PASSWORD: ""
  TAPO_PLUG_IP: ""
  TAPO_RELAY_URL: ""
  # --- Circuit admission and plug caps ---
  DEFAULT_PLUG_CAP_A: ""
  ENFORCE_CIRCUIT_ADMISSION: ""
  # --- Reservation policy ---
  RESERVATION_MAX_HOURS: ""
  RESERVATION_MAX_ADVANCE_DAYS: ""
  MAX_UPCOMING_RESERVATIONS_PER_USER: ""
  RESERVATION_NO_SHOW_GRACE_MIN: ""
  RESERVATION_WALKUP_WARN_LOOKAHEAD_MIN: ""
---
# Keys for the broker auth Secret (real content = the generated passwd/acl files)
apiVersion: v1
kind: Secret
metadata:
  name: amphive-mqtt-auth
  namespace: amphive
type: Opaque
stringData:
  passwd: "REPLACE_WITH_mosquitto_passwd_CONTENTS"
  acl: "REPLACE_WITH_mosquitto_acl_CONTENTS"
---
# Keys for the broker TLS Secret (real content = deploy/config/mqtt-certs/*)
apiVersion: v1
kind: Secret
metadata:
  name: amphive-mqtt-certs
  namespace: amphive
type: Opaque
stringData:
  ca.crt: "REPLACE_WITH_ca.crt_PEM"
  server.crt: "REPLACE_WITH_server.crt_PEM"
  server.key: "REPLACE_WITH_server.key_PEM"
