# ── Authentication (enforced 2026-07-07 — see docs/SECURITY.md §3) ───────────
# Every client must authenticate against the passwd file (generated on the VM
# by deploy.ps1 from the MQTT_* values in .env): the backend, the compose
# healthcheck, and each gateway (NVS mqtt_user/mqtt_pwd, provisioned via the
# captive portal's optional MQTT fields). per_listener_settings defaults to
# false, so this applies to BOTH listeners below.
password_file /mosquitto/config/passwd
allow_anonymous false

# ── Topic ACLs (added with the public 8883 exposure) ─────────────────────────
# Generated on the VM by deploy.ps1 from the .env usernames. Model:
#   backend account          -> readwrite amphive/#, read $SYS/# (healthcheck)
#   legacy shared gw account -> readwrite amphive/gateways/#  (transition only)
#   per-gateway accounts     -> pattern readwrite amphive/gateways/%u/#
#     (username == gateway_id, created via deploy/scripts/add_gateway_user.ps1)
# Unlisted user+topic combinations are denied. Applies to both listeners.
acl_file /mosquitto/config/acl

# ── Plaintext listener (1883) ────────────────────────────────────────────────
# Backend over the internal Docker network (isolated) + transition / OTA-
# rollback target for gateways. Published only on the overlay IP (compose
# MQTT_BIND_IP). Bind internal-only once every gateway is on 8883.
listener 1883 0.0.0.0

# ── TLS listener (8883) — added 2026-07-08 (SECURITY.md §3) ───────────────────
# Gateways connect here over the overlay with mqtts:// and validate the broker
# cert against the CA embedded in firmware (chain + IP SAN). Server-auth only
# (require_certificate false) — clients still present username/password.
# Certs are mounted from ~/amphive/mqtt-certs (deploy.ps1 transfers them).
listener 8883 0.0.0.0
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate false
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
log_dest stdout
