listener 1883 0.0.0.0

# ── Authentication (staged rollout — see docs/SECURITY.md §3) ────────────────
# Stage 1 (current): the passwd file is mounted by compose (generated on the
# VM by deploy.ps1 from the MQTT_* values in .env) but anonymous is still
# allowed, so gateways keep working while their NVS gets mqtt_user/mqtt_pwd
# provisioned. Valid credentials are already verified against the file.
# Stage 2 (the flip): change allow_anonymous to false once every gateway
# publishes with credentials. The compose healthcheck already authenticates,
# and the backend + gateway firmware present credentials when configured.
password_file /mosquitto/config/passwd
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
