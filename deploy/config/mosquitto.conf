listener 1883 0.0.0.0

# ── Authentication (enforced 2026-07-07 — see docs/SECURITY.md §3) ───────────
# Every client must authenticate against the passwd file (generated on the VM
# by deploy.ps1 from the MQTT_* values in .env): the backend, the compose
# healthcheck, and each gateway (NVS mqtt_user/mqtt_pwd, provisioned via the
# captive portal's optional MQTT fields). A gateway without credentials can no
# longer connect — provision it before pointing it at this broker.
password_file /mosquitto/config/passwd
allow_anonymous false

persistence true
persistence_location /mosquitto/data/
log_dest stdout
