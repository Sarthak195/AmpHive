# =============================================================================
# AmpHive Production Docker Compose — WITH TLS (Caddy front door)
#
# This is docker-compose.prod.yml plus a Caddy reverse proxy that terminates
# HTTPS (auto Let's Encrypt via HTTP-01). Caddy is the only public web
# entrypoint: it publishes 80 (ACME challenge + HTTP->HTTPS redirect) and 443;
# the frontend container no longer publishes a host port and is reached over
# the internal compose network as 'frontend:80'.
#
# Deployed by deploy/scripts/deploy.ps1 (the default since 2026-07-11), which
# also generates the Caddyfile on the VM from CADDY_DOMAIN / ACME_EMAIL in
# .env. Keep the db/mqtt/backend services in lockstep with
# docker-compose.prod.yml (the -NoTls rollback target).
# =============================================================================
version: '3.7'

services:
  db:
    image: postgres:15-alpine
    container_name: amphive-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Interpolated from .env (deploy.ps1 ensures it exists and builds the
      # matching DATABASE_URL). Plain ${VAR} syntax — no :-defaults, which the
      # VM's docker-compose v1 can't parse.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: amphive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: amphive-mqtt
    restart: always
    ports:
      # Plaintext 1883 is NO LONGER host-published (2026-07-20): the whole
      # fleet is on direct-MQTT 8883, and the backend + fake-plug reach
      # 'mqtt' over the compose network, which needs no published port.
      # Break-glass rollback: re-add "${MQTT_BIND_IP}:1883:1883" here.
      #
      # TLS listener (8883): PUBLIC by default (direct-MQTT path — gateways and
      # agents dial out to mqtts://<public-ip>:8883; auth = TLS + per-gateway
      # creds + ACLs, see docs/SECURITY.md §3). Override MQTT_TLS_BIND_IP in
      # .env to re-restrict it (e.g. to the overlay IP).
      - "${MQTT_TLS_BIND_IP:-0.0.0.0}:8883:8883"
      # (9001 removed: it was published but mosquitto has no websocket listener.)
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      # Generated on the VM by deploy.ps1 (mosquitto_passwd) from MQTT_* in .env.
      - ./mosquitto_passwd:/mosquitto/config/passwd
      # Topic ACLs, generated on the VM by deploy.ps1 (see mosquitto.conf).
      - ./mosquitto_acl:/mosquitto/config/acl
      # TLS certs (ca.crt, server.crt, server.key) transferred by deploy.ps1.
      - ./mqtt-certs:/mosquitto/config/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      # Authenticates so it keeps passing after the allow_anonymous=false flip.
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 5 -u ${MQTT_USERNAME} -P ${MQTT_PASSWORD} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Bound + rotate the container's stdout log (TD#28) — mosquitto.conf's
    # `log_dest file` mirror on the mosquitto_log volume is the durable copy
    # that survives container recreation; this caps the operationally-primary
    # stdout stream (`docker logs` / `docker-compose logs`) so a busy broker
    # can't fill the VM's disk.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amphive-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - COINS_PER_RUPEE=${COINS_PER_RUPEE}
      - COINS_PER_KWH=${COINS_PER_KWH}
      # Session-start floor on the driver's AVAILABLE balance; empty = code
      # default (50). Quoted back by GET /api/config.
      - MIN_START_BALANCE_COINS=${MIN_START_BALANCE_COINS}
      - PLATFORM_FEE_PCT=${PLATFORM_FEE_PCT}
      - GST_RATE_PCT=${GST_RATE_PCT}
      - TELEMETRY_RETENTION_DAYS=${TELEMETRY_RETENTION_DAYS}
      # Auth rate limits ("<attempts>/<window sec>" per IP); empty = code defaults
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT}
      - REGISTER_RATE_LIMIT=${REGISTER_RATE_LIMIT}
      # Web Push (driver notifications); empty = push disabled
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      # Password-reset links + email delivery; SMTP_* empty = links logged
      # at WARNING (console fallback) instead of emailed.
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # [Direct Mode] Tapo P110 control via WireGuard tunnel (bypasses ESP32)
      - DIRECT_MODE=${DIRECT_MODE}
      - TAPO_USERNAME=${TAPO_USERNAME}
      - TAPO_PASSWORD=${TAPO_PASSWORD}
      - TAPO_PLUG_IP=${TAPO_PLUG_IP}
      - TAPO_RELAY_URL=${TAPO_RELAY_URL}
    depends_on:
      - db
      - mqtt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amphive-frontend
    restart: always
    # No host port: Caddy is the public web entrypoint and reaches this
    # container over the internal network as 'frontend:80'. The frontend's
    # own nginx keeps proxying /api and /socket.io to the backend.
    expose:
      - "80"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: amphive-caddy
    restart: always
    ports:
      - "80:80"     # ACME HTTP-01 challenge + HTTP->HTTPS redirect
      - "443:443"
    volumes:
      # Generated on the VM by deploy.ps1 from CADDY_DOMAIN / ACME_EMAIL in .env.
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data      # persists issued certificates across restarts
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:   # Persists DB data across container rebuilds
  caddy_data:
  caddy_config:
