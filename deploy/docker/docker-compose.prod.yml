# =============================================================================
# AmpHive Production Docker Compose
# This file is deployed to the GCP VM at ~/amphive/docker-compose.yml
# All paths assume the flat VM directory structure created by deploy.ps1
#
# Database: PostgreSQL runs as a container on the VM itself (no Cloud SQL).
# Data is persisted via the 'postgres_data' named Docker volume, so it
# survives container rebuilds and restarts.
# =============================================================================
version: '3.7'

services:
  db:
    image: postgres:15-alpine
    container_name: amphive-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Interpolated from .env (deploy.ps1 ensures it exists and builds the
      # matching DATABASE_URL). Plain ${VAR} syntax — no :-defaults, which the
      # VM's docker-compose v1 can't parse.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: amphive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: amphive-mqtt
    restart: always
    # Block privilege escalation. NOT cap_drop-ed: the mosquitto image starts as
    # root to chown its data/log dirs and setuid down to the mosquitto user, so
    # dropping ALL caps risks breaking that startup — kept conservative per the
    # audit (do-not-break mqtt).
    security_opt:
      - "no-new-privileges:true"
    ports:
      # MQTT_BIND_IP controls which HOST interface the broker is reachable on.
      # 0.0.0.0 = public internet (legacy, insecure: the broker is anonymous).
      # Set it to the VM's overlay/Tailscale IP (e.g. 100.87.241.70) in .env so
      # only overlay peers (the ESP32 gateways) can reach port 1883. The
      # backend is unaffected — it reaches 'mqtt' over the compose network,
      # not via this published port.
      - "${MQTT_BIND_IP}:1883:1883"
      # TLS listener (8883): PUBLIC by default (direct-MQTT path — gateways and
      # agents dial out to mqtts://<public-ip>:8883; auth = TLS + per-gateway
      # creds + ACLs, see docs/SECURITY.md §3). Override MQTT_TLS_BIND_IP in
      # .env to re-restrict it (e.g. to the overlay IP).
      - "${MQTT_TLS_BIND_IP:-0.0.0.0}:8883:8883"
      # (9001 removed: it was published but mosquitto has no websocket listener.)
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      # Generated on the VM by deploy.ps1 (mosquitto_passwd) from MQTT_* in .env.
      - ./mosquitto_passwd:/mosquitto/config/passwd
      # Topic ACLs, generated on the VM by deploy.ps1 (see mosquitto.conf).
      - ./mosquitto_acl:/mosquitto/config/acl
      # TLS certs (ca.crt, server.crt, server.key) transferred by deploy.ps1.
      - ./mqtt-certs:/mosquitto/config/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      # Authenticates so it keeps passing after the allow_anonymous=false flip.
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 5 -u ${MQTT_USERNAME} -P ${MQTT_PASSWORD} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Bound + rotate the container's stdout log (TD#28) — mosquitto.conf's
    # `log_dest file` mirror on the mosquitto_log volume is the durable copy
    # that survives container recreation; this caps the operationally-primary
    # stdout stream (`docker logs` / `docker-compose logs`) so a busy broker
    # can't fill the VM's disk.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amphive-backend
    restart: always
    # Hardening (Dockerfile already runs uvicorn as non-root uid 10001): block
    # privilege escalation and drop ALL Linux capabilities — uvicorn on the
    # unprivileged :8000 needs none.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - COINS_PER_RUPEE=${COINS_PER_RUPEE}
      - COINS_PER_KWH=${COINS_PER_KWH}
      # Session-start floor on the driver's AVAILABLE balance; empty = code
      # default (50). Quoted back by GET /api/config.
      - MIN_START_BALANCE_COINS=${MIN_START_BALANCE_COINS}
      - PLATFORM_FEE_PCT=${PLATFORM_FEE_PCT}
      - GST_RATE_PCT=${GST_RATE_PCT}
      - TELEMETRY_RETENTION_DAYS=${TELEMETRY_RETENTION_DAYS}
      # Auth rate limits ("<attempts>/<window sec>" per IP); empty = code defaults
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT}
      - REGISTER_RATE_LIMIT=${REGISTER_RATE_LIMIT}
      # Web Push (driver notifications); empty = push disabled
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      # Circuit admission control and caps configuration; empty = code defaults
      - DEFAULT_PLUG_CAP_A=${DEFAULT_PLUG_CAP_A}
      - ENFORCE_CIRCUIT_ADMISSION=${ENFORCE_CIRCUIT_ADMISSION}
      # Reservation policy configuration; empty = code defaults
      - RESERVATION_MAX_HOURS=${RESERVATION_MAX_HOURS}
      - RESERVATION_MAX_ADVANCE_DAYS=${RESERVATION_MAX_ADVANCE_DAYS}
      - MAX_UPCOMING_RESERVATIONS_PER_USER=${MAX_UPCOMING_RESERVATIONS_PER_USER}
      - RESERVATION_NO_SHOW_GRACE_MIN=${RESERVATION_NO_SHOW_GRACE_MIN}
      - RESERVATION_WALKUP_WARN_LOOKAHEAD_MIN=${RESERVATION_WALKUP_WARN_LOOKAHEAD_MIN}
    depends_on:
      - db
      - mqtt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amphive-frontend
    restart: always
    # Hardening: block privilege escalation and drop ALL caps, then add back only
    # what the stock nginx image genuinely needs — NET_BIND_SERVICE (bind :80),
    # SETUID/SETGID (master spawns workers as the nginx user), CHOWN (master
    # chowns its cache/temp dirs to that user at startup). If nginx fails to
    # start or large /api responses error after a redeploy, add DAC_OVERRIDE.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:   # Persists DB data across container rebuilds

