# =============================================================================
# AmpHive Production Docker Compose
# This file is deployed to the GCP VM at ~/amphive/docker-compose.yml
# All paths assume the flat VM directory structure created by deploy.ps1
#
# Database: PostgreSQL runs as a container on the VM itself (no Cloud SQL).
# Data is persisted via the 'postgres_data' named Docker volume, so it
# survives container rebuilds and restarts.
# =============================================================================
version: '3.7'

services:
  db:
    image: postgres:15-alpine
    container_name: amphive-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Interpolated from .env (deploy.ps1 ensures it exists and builds the
      # matching DATABASE_URL). Plain ${VAR} syntax — no :-defaults, which the
      # VM's docker-compose v1 can't parse.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: amphive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: amphive-mqtt
    restart: always
    ports:
      # MQTT_BIND_IP controls which HOST interface the broker is reachable on.
      # 0.0.0.0 = public internet (legacy, insecure: the broker is anonymous).
      # Set it to the VM's overlay/Tailscale IP (e.g. 100.87.241.70) in .env so
      # only overlay peers (the ESP32 gateways) can reach port 1883. The
      # backend is unaffected — it reaches 'mqtt' over the compose network,
      # not via this published port.
      - "${MQTT_BIND_IP}:1883:1883"
      # TLS listener (8883): PUBLIC by default (direct-MQTT path — gateways and
      # agents dial out to mqtts://<public-ip>:8883; auth = TLS + per-gateway
      # creds + ACLs, see docs/SECURITY.md §3). Override MQTT_TLS_BIND_IP in
      # .env to re-restrict it (e.g. to the overlay IP).
      - "${MQTT_TLS_BIND_IP:-0.0.0.0}:8883:8883"
      # (9001 removed: it was published but mosquitto has no websocket listener.)
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      # Generated on the VM by deploy.ps1 (mosquitto_passwd) from MQTT_* in .env.
      - ./mosquitto_passwd:/mosquitto/config/passwd
      # Topic ACLs, generated on the VM by deploy.ps1 (see mosquitto.conf).
      - ./mosquitto_acl:/mosquitto/config/acl
      # TLS certs (ca.crt, server.crt, server.key) transferred by deploy.ps1.
      - ./mqtt-certs:/mosquitto/config/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      # Authenticates so it keeps passing after the allow_anonymous=false flip.
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 5 -u ${MQTT_USERNAME} -P ${MQTT_PASSWORD} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amphive-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - COINS_PER_RUPEE=${COINS_PER_RUPEE}
      - COINS_PER_KWH=${COINS_PER_KWH}
      - TELEMETRY_RETENTION_DAYS=${TELEMETRY_RETENTION_DAYS}
      # [Direct Mode] Tapo P110 control via WireGuard tunnel (bypasses ESP32)
      - DIRECT_MODE=${DIRECT_MODE}
      - TAPO_USERNAME=${TAPO_USERNAME}
      - TAPO_PASSWORD=${TAPO_PASSWORD}
      - TAPO_PLUG_IP=${TAPO_PLUG_IP}
      - TAPO_RELAY_URL=${TAPO_RELAY_URL}
    depends_on:
      - db
      - mqtt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amphive-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:   # Persists DB data across container rebuilds

