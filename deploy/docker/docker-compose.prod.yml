# =============================================================================
# AmpHive Production Docker Compose
# This file is deployed to the GCP VM at ~/amphive/docker-compose.yml
# All paths assume the flat VM directory structure created by deploy.ps1
#
# Database: PostgreSQL runs as a container on the VM itself (no Cloud SQL).
# Data is persisted via the 'postgres_data' named Docker volume, so it
# survives container rebuilds and restarts.
# =============================================================================
version: '3.7'

services:
  db:
    image: postgres:15-alpine
    container_name: amphive-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-amphive_db_admin}
      POSTGRES_DB: amphive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: amphive-mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amphive-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - COINS_PER_RUPEE=${COINS_PER_RUPEE}
      - COINS_PER_KWH=${COINS_PER_KWH:-5.0}
      # [Direct Mode] Tapo P110 control via WireGuard tunnel (bypasses ESP32)
      - DIRECT_MODE=${DIRECT_MODE:-false}
      - TAPO_USERNAME=${TAPO_USERNAME:-}
      - TAPO_PASSWORD=${TAPO_PASSWORD:-}
      - TAPO_PLUG_IP=${TAPO_PLUG_IP:-}
      - TAPO_RELAY_URL=${TAPO_RELAY_URL:-}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amphive-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:   # Persists DB data across container rebuilds

