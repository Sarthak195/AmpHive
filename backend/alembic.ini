# Alembic CLI config — for authoring migrations from a dev checkout:
#   alembic -c backend/alembic.ini revision --autogenerate -m "..."
#   alembic -c backend/alembic.ini upgrade head
# The URL comes from the DATABASE_URL env var (env.py falls back to it when
# sqlalchemy.url is empty). At app startup, backend/database/db.py builds the
# config programmatically — this file is not read in production.
[alembic]
script_location = %(here)s/migrations
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
