# Root-level tool config for the backend (FastAPI/Python) codebase. ruff and
# mypy both search upward from the file being linted, so running
# `ruff check backend/` or `mypy backend/services backend/routers` from the
# repo root (as CI does) picks this file up automatically.

[tool.ruff]
# p50 line length in backend/ is ~37 chars, p95 is ~81, p99 is ~96 (measured
# 2026-07-21 across backend/**/*.py) — 100 covers the codebase's real style
# with a little headroom, without being so generous it stops meaning anything.
line-length = 100

[tool.ruff.lint]
# Default E/F/W (pycodestyle errors/warnings + pyflakes) plus isort (I) —
# a standard, unsurprising ruleset. Not the stricter pyupgrade/bugbear/etc.
# families: those would surface hundreds of stylistic findings across a
# codebase that predates this config and hasn't been running under it.
select = ["E", "F", "W", "I"]
ignore = [
    # E501 (line-too-long): even at line-length=100 this surfaces ~240 hits,
    # ~70% of them single-line SQLAlchemy declarative columns in
    # backend/database/models.py (one mapped_column(...) per attribute, with
    # a trailing server_default/comment) plus a handful of long log/query
    # lines elsewhere. Ruff has no autofix for E501, so clearing this would
    # mean hand-wrapping ~240 lines for no readability win. Revisit if the
    # project adopts an autoformatter (ruff format/black) that would keep
    # them wrapped for free.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Alembic migration files are semi-generated (autogenerate + hand edits) and
# routinely need to import models/enums only for their side effects or for
# type-adjacent constants; holding them to the same import-hygiene bar as
# hand-written app code isn't worth the churn.
"backend/migrations/versions/*.py" = ["F401", "E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
# Only report errors in the files listed below; modules they import (some of
# which are on the TODO list, still full of errors) are type-checked for
# inference but not re-reported here — otherwise mypy would surface every
# error transitively through `from backend.routers.cpo import ...` re-exports.
follow_imports = "silent"
# Lenient starter config: no strict flags, no repo-wide gate. Measured
# 2026-07-21 by running mypy (this config) over all of backend/services +
# backend/routers: 149 errors across 18 files — mostly real gaps (untyped
# SQLAlchemy Result.rowcount/mixin-attribute access from the MQTTManager
# split, Decimal/float/Optional[int] mismatches in pricing/tariffs) that need
# actual type-design work, not config tweaks, so this is scoped down to just
# the 39 files that pass today with zero errors — CI stays green, and the
# scope only grows as files are fixed and added below.
files = [
    "backend/routers/__init__.py",
    "backend/routers/cpo/__init__.py",
    "backend/routers/cpo/_analytics.py",
    "backend/routers/cpo/_common.py",
