# AmpHive CI — pytest (backend) + eslint (frontend) on every push/PR.
# This is the pipeline that would have caught the get_participants
# "verified-but-broken" regression before it shipped (TD#13).
#
# Runner cost note: this repo is PUBLIC, so standard GitHub-hosted runners
# (ubuntu-latest here) are FREE with unlimited minutes — the 2000/3000-min
# quota only applies to PRIVATE repos. The two settings below cut wasted runs
# anyway (good hygiene, and they'd matter if this repo ever went private):
#   - concurrency: cancel a ref's in-flight run when a newer commit lands, so
#     rapid PR pushes don't pile up N full runs.
#   - paths-ignore: skip CI for docs-only changes (no test/lint surface). Safe
#     here because main has no required status checks; a mixed docs+code change
#     still runs (paths-ignore only skips when EVERY changed file matches).

name: CI

# Cancel superseded runs on the same branch/PR (keeps the newest, drops the rest).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '**/*.md'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # Postgres is provisioned for the Phase-1 integration tests planned in
    # docs/TESTING.md (session billing / payment concurrency); today's suite
    # is DB-free and ignores it.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: amphive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the backend Dockerfile (python:3.11), not the docs' 3.12.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        # The LOCKFILE, not requirements.txt: backend/Dockerfile installs
        # requirements.lock.txt, so testing the loose `>=` spec meant CI could
        # be green against a dependency set production never runs (and a
        # lockfile could drift for weeks unnoticed — it had, by a year for
        # bcrypt). requirements-dev.txt brings pytest/ruff/mypy on top; its
        # `-r requirements.txt` line is harmless here because every pin in the
        # lock already satisfies it.
        run: pip install -r backend/requirements.lock.txt -r backend/requirements-dev.txt
      - name: Lint (ruff)
        # Config lives in pyproject.toml (E/F/W + isort; E501 ignored — see
        # that file for why). Was `--select F401` only; widened 2026-07-21.
        run: ruff check backend/
      - name: Type-check (mypy)
        # Lenient starter config (pyproject.toml [tool.mypy]) scoped to the
        # 39 backend/services + backend/routers files that pass today;
        # remaining files are TODO-listed there, not silently exempted.
        run: mypy
      - name: Run tests
        # Coverage floor is 66% — 2 points below the 68.39% measured
        # 2026-07-21 (`pytest backend --cov=backend --cov-report=term-missing`,
        # DB-gated tests skipping locally). CI runs those DB-gated tests too
        # (Postgres service above), so real CI coverage is higher than the
        # local baseline this floor was measured against.
        run: pytest backend/tests -q --cov=backend --cov-report=term-missing --cov-fail-under=66
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/amphive_test

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        # A broken Vite build was previously caught only by `docker build` on
        # the VM during a deploy — the slowest and most expensive place to
        # find it (deploy.ps1 allows a 25-minute window). Catch it here.
        run: npm run build

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

  security:
    # Dependency + secret scanning. Split from the test jobs so a newly
    # published advisory shows up as its own red check rather than looking
    # like a test regression.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python dependencies (pip-audit)
        # Audits the LOCKFILE — the exact set the production image installs.
        #
        # ecdsa PYSEC-2026-1325 (Minerva timing side-channel) is ignored
        # DELIBERATELY and is the only exception: upstream has published NO
        # fixed version, it arrives transitively via python-jose, and it is
        # only reachable for ES* algorithms. AmpHive pins HS256 on both the
        # encode and decode side (backend/services/auth.py JWT_ALGORITHM), so
        # the vulnerable code path is never entered. Re-check this when
        # python-jose is replaced or ecdsa ships a fix; do not add further
        # ignores without the same kind of written justification.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock.txt \
            --ignore-vuln PYSEC-2026-1325 \
            --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm production dependencies
        # Hard gate on what actually ships in the browser bundle. Dev/build
        # chain advisories are reported below but do not fail the build: they
        # are not reachable by a user of the deployed site, and letting them
        # block merges trains people to ignore a red check.
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit npm dev dependencies (report only)
        working-directory: frontend
        run: npm audit --audit-level=moderate || true

      - name: Scan for committed secrets (gitleaks)
        # This repo is PUBLIC and its history has never been rewritten, so a
        # secret committed by accident is world-readable the moment it lands.
        # Four real secrets reached history before 2026-07-06 (all since
        # rotated — see docs/SECURITY.md §1); this is the check that stops the
        # fifth.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
