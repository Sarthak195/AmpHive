# Builds AmpHiveFlasher.exe (tools/flasher/) — a onefile Windows console app
# that flashes prebuilt gateway firmware onto a plugged-in ESP32 board. See
# tools/flasher/README.md for the full picture.
#
# This workflow does NOT build firmware. It only packages the Python flasher
# tool (esptool + pyserial + amphive_flasher/) into a single .exe. Merged
# firmware images are produced separately by a maintainer with the real
# ESP-IDF toolchain (tools/flasher/scripts/build-merged-image.ps1) and
# attached to GitHub releases by hand — building those in CI would mean
# installing the multi-gigabyte ESP-IDF on every run for an artifact that
# only changes when firmware does, which isn't worth it here.

name: Build flasher EXE

on:
  workflow_dispatch: {}
  push:
    tags:
      # Dedicated prefix so this doesn't fire on firmware/backend release
      # tags — the flasher EXE version and the firmware version are
      # independent.
      - "flasher-v*"

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/flasher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/flasher/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # Pure-logic tests only (port ranking, chip->image mapping, CLI
        # orchestration) — serial/esptool/network are mocked, so this never
        # needs real hardware or a live GitHub connection.
        run: pytest tests -v

      - name: Build AmpHiveFlasher.exe
        run: pyinstaller AmpHiveFlasher.spec --distpath dist --workpath build --noconfirm

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmpHiveFlasher
          path: tools/flasher/dist/AmpHiveFlasher.exe
          if-no-files-found: error
