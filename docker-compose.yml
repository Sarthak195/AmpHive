# =============================================================================
# AmpHive — Local Development Shortcut
#
# This is a convenience wrapper so `docker compose up` works from the project root.
# It mirrors the dev compose at deploy/docker/docker-compose.dev.yml.
#
# For production deployment, see: deploy/docker/docker-compose.prod.yml
# For the deploy script, see:     deploy/scripts/deploy.ps1
# =============================================================================
version: '3.7'

services:
  db:
    image: postgres:15-alpine
    container_name: amphive-db-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: amphive_dev
      POSTGRES_DB: amphive
    volumes:
      - pg_dev_data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: amphive-mqtt-dev
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./deploy/config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amphive-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:amphive_dev@db:5432/amphive
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - COINS_PER_RUPEE=${COINS_PER_RUPEE}
      # [Direct Mode] Tapo P110 control via WireGuard tunnel (bypasses ESP32)
      - DIRECT_MODE=${DIRECT_MODE:-false}
      - TAPO_USERNAME=${TAPO_USERNAME:-}
      - TAPO_PASSWORD=${TAPO_PASSWORD:-}
      - TAPO_PLUG_IP=${TAPO_PLUG_IP:-}
      - TAPO_RELAY_URL=${TAPO_RELAY_URL:-}
    depends_on:
      - db
      - mqtt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amphive-frontend-dev
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_dev_data:
