# Managed component dependencies (ESP-IDF component manager).
#
# ESP-IDF v6.0 moved esp-mqtt out of core into the component registry. The
# firmware REQUIRES `mqtt` and #includes "mqtt_client.h", so pull it from the
# registry here (registers under the component name `mqtt`). cJSON, also removed
# from v6 core, is vendored locally at components/json instead.
dependencies:
  espressif/mqtt: "^1.0.0"
