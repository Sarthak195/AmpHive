# =============================================================================
# AmpHive frontend container web server.
#
# Dropped in at /etc/nginx/conf.d/default.conf (see frontend/Dockerfile), so
# everything at the top level of this file is in nginx's `http` context — that
# is why the `map` below is legal here and does not need to live in nginx.conf
# proper.
#
# NOTE: this file cannot be runtime-validated from the dev box (no nginx here).
# Run `nginx -t` inside the built image / on the VM as part of any deploy that
# touches it.
# =============================================================================

# ---- X-Robots-Tag: keep the operator console out of the search index --------
# The driver app (amphive.app) and the operator console (cpo.amphive.app) are
# the SAME container serving the SAME bytes — identical HTML, identical
# <title>, identical marketing description. Left alone, the console gets
# crawled and indexed under the driver app's description, which is both wrong
# and a duplicate-content split of every URL.
#
# src/hooks/useDocumentMeta.js already writes a `noindex, nofollow` robots meta
# tag on every non-public route, but that is a JS-dependent control: it only
# exists after the bundle boots. This header is the belt-and-braces layer
# underneath it — emitted by the web server itself, so it holds for a crawler
# that fetches the HTML and never executes a line of JavaScript, and for
# non-HTML responses (a directly-fetched JSON or asset URL) that have no
# <head> to put a meta tag in at all.
#
# Matched on the `cpo.` host prefix rather than a literal hostname so it also
# covers staging/preview console hostnames and survives CADDY_CPO_DOMAIN being
# repointed. Empty string on every other host: nginx's add_header skips a
# header whose value evaluates to "", so the driver origin emits nothing.
map $host $robots_tag {
    default     "";
    ~^cpo\.     "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx build in the `Server` header or on the
    # stock error pages. Version disclosure is what turns "scan the internet
    # for anything nginx" into "scan for this CVE's affected range" — cheap to
    # remove, and nothing in the stack parses the version back out.
    server_tokens off;

    # DoS hardening: explicit request-body cap so the limit is documented
    # here rather than relying on nginx's undeclared compiled-in ~1 MB
    # default. Mirrors backend/main.py's MAX_REQUEST_BODY_BYTES (1 MB) —
    # this is the defense-in-depth layer in front of it; a request that
    # bypasses this proxy (e.g. hitting the backend's :8000 debug port
    # directly) still hits the app-layer check.
    client_max_body_size 1m;

    # ---- Compression --------------------------------------------------------
    # Not every deploy path has a compressing proxy in front. The relay Caddy
    # does `encode gzip`, but docker-compose.prod.yml -NoTls, a self-hoster's
    # own proxy, and anything hitting this container directly do not — and the
    # bundle is ~296 KB of JS + ~73 KB of CSS, which is 3-4x that decision on
    # a 3G phone in the target market. Gzip here makes the container correct
    # on its own rather than correct-only-behind-Caddy; double compression is
    # not a risk because Caddy will not re-encode an already-encoded upstream
    # response.
    #
    # text/html is compressed unconditionally by nginx and must not be listed
    # (nginx warns about the duplicate). gzip_vary emits `Vary:
    # Accept-Encoding` so a shared cache cannot hand a gzipped body to a
    # client that did not ask for one. gzip_min_length keeps nginx from
    # spending CPU to make tiny files bigger — below ~1 KB the gzip header and
    # dictionary overhead usually wins.
    #
    # BOTH `text/javascript` and `application/javascript` are listed on
    # purpose: nginx 1.21.1 changed the default mime.types mapping for `.js`
    # from application/javascript to text/javascript, so a list carrying only
    # the old name silently stops compressing the entire bundle the day the
    # base image moves forward — the exact bug this whole block exists to fix.
    #
    # `gzip_proxied any` means API responses get compressed too. That is
    # normally where someone raises BREACH; it does not apply here. BREACH
    # needs a compression oracle driven cross-origin, which needs the browser
    # to attach credentials to an attacker-initiated request. This API
    # authenticates with a bearer JWT read from storage by our own JS, not
    # with an ambient cookie, so a cross-origin request carries no credentials
    # and there is no oracle to measure. If session cookies are ever
    # introduced, revisit this line before anything else.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Security response headers on EVERY deploy path — not only behind the relay
    # Caddy (docker-compose.tls.yml / relay), but also the plain-HTTP
    # docker-compose.prod.yml -NoTls path and any self-hoster who puts their own
    # proxy in front. The CSP and Permissions-Policy strings are copied
    # VERBATIM into deploy/relay/deploy-relay.sh's Caddyfile generator and
    # deploy/config/Caddyfile.example (razorpay script/frame-src,
    # 'unsafe-inline' styles, self-hosted data: fonts, wss: websockets) — three
    # places, keep all of them in sync.
    #
    # CSP notes:
    #   frame-ancestors 'none'  the modern, non-deprecated replacement for
    #                           X-Frame-Options. Both are sent: frame-ancestors
    #                           is what every current browser enforces,
    #                           X-Frame-Options stays as the legacy companion
    #                           (some older/embedded WebViews honour only it).
    #   object-src 'none'       kills <object>/<embed>/<applet>. The app has
    #                           none, and a plugin document is a long-standing
    #                           way to get script execution past an otherwise
    #                           tight policy. `default-src 'self'` does cover
    #                           object-src by fallback, but 'self' is weaker
    #                           than 'none' and a same-origin uploaded file
    #                           should never be embeddable as a plugin.
    #
    # Permissions-Policy notes:
    #   geolocation=(self)      NOT denied. /map genuinely calls
    #                           navigator.geolocation to centre on the driver;
    #                           a blanket geolocation=() would silently break
    #                           the app's single most useful feature. `self`
    #                           allows this origin and no embedded third party.
    #   payment=()              denied. If Razorpay Checkout is ever switched
    #                           on and its iframe needs the W3C Payment Request
    #                           API (Google Pay on Chrome), THIS is the line to
    #                           relax — to `payment=(self "https://api.razorpay.com")`,
    #                           not to drop the directive. Razorpay's UPI/card
    #                           flows do not need it; PaymentRequest-backed
    #                           Google Pay does.
    #   interest-cohort=()      opts out of FLoC/Topics. Chrome dropped FLoC,
    #                           and an unrecognised feature name is ignored per
    #                           spec, so this is inert-but-harmless and kept for
    #                           parity with backend/main.py's _SECURITY_HEADERS.
    #
    # Coexistence with Caddy: for the primary domains, Caddy's own `header`
    # block SETS (replaces) these same values, so there is exactly one CSP per
    # response — no duplication. For the bare-http Caddy site and non-Caddy
    # deploys, these nginx headers are the source of truth.
    #
    # nginx add_header inheritance gotcha: a `location` that declares ANY
    # add_header DROPS all inherited ones. The four locations below (/assets/,
    # = /sw.js, the known-route SPA regex, and /) all set Cache-Control, so this
    # block is repeated verbatim inside each of them. Keep all FIVE copies
    # identical. `always` emits the header even on error (4xx/5xx) responses —
    # which now matters more than it used to, because the SPA's own 404 page is
    # served as a real 404 (see the route allowlist below).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://*.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), usb=(), payment=(), interest-cohort=()" always;
    add_header X-Robots-Tag $robots_tag always;

    # ---- Proxied API --------------------------------------------------------
    # `^~` so this prefix wins outright over the regex location further down
    # and nginx stops looking at regexes: a future SPA route literally named
    # /api/... could otherwise steal API traffic, and the failure mode (the
    # HTML shell returned where JSON was expected) is a confusing one.
    #
    # proxy_hide_header: backend/main.py's security_headers_middleware now sets
    # its own, API-appropriate security headers (CSP `default-src 'none'`, plus
    # the same X-Content-Type-Options / X-Frame-Options / Referrer-Policy /
    # Permissions-Policy set) so a response served straight off uvicorn is not
    # bare. This location declares no add_header of its own, so it INHERITS the
    # server-level block above — meaning without these lines every API response
    # would carry two Content-Security-Policy headers. Two CSPs are not merged;
    # a browser enforces the INTERSECTION, and "guess which of two policies
    # applies" is exactly the kind of thing that breaks months later. Hide the
    # upstream copies and let nginx's single set stand.
    #
    # The Permissions-Policy nginx re-adds is very slightly looser than the
    # backend's (geolocation=(self) vs geolocation=()), which is inert on a
    # JSON response — a JSON body is not a document and cannot call the
    # Geolocation API. Keeping the backend's stricter value would mean
    # declaring add_header here, which per the inheritance gotcha would force a
    # SIXTH verbatim copy of the whole block; not worth it.
    #
    # DELIBERATELY NOT HIDDEN: Cache-Control. The backend sets `no-store` on
    # API responses and nginx sets no Cache-Control at server level, so hiding
    # it would leave per-user API responses with no caching directive at all —
    # i.e. heuristically cacheable by any intermediary. Leave it alone.
    location ^~ /api/ {
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # [Firmware upload] The one endpoint that legitimately carries a >1m
    # body: a raw signed OTA image (~1-2 MB; the OTA app partition allows up
    # to 1.9 MB). 8m here so the backend's own tighter caps (4 MiB middleware
    # carve-out + endpoint re-check, see backend/main.py
    # FIRMWARE_UPLOAD_MAX_BYTES) produce the user-facing 413, not an opaque
    # nginx error page.
    #
    # An exact-match location does NOT inherit the sibling /api/ block, so the
    # proxy_hide_header set has to be repeated here too — otherwise this one
    # endpoint would be the only API response carrying a doubled CSP.
    location = /api/admin/firmware-releases/upload {
        client_max_body_size 8m;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        proxy_pass http://backend:8000/api/admin/firmware-releases/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.io WebSocket connections. Same `^~` + proxy_hide_header
    # reasoning as /api/ above (the Socket.io HTTP long-poll handshake is a
    # normal response and picks up the backend's middleware headers).
    location ^~ /socket.io/ {
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        proxy_pass http://backend:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Vite content-hashes everything under /assets/ (index-<hash>.js/.css),
    # so these are safe to cache forever — a new build ships new filenames.
    # `^~` keeps a hypothetical /assets route in App.jsx from ever shadowing
    # the real build output via the regex location below.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repeat the security headers — this block's add_header voids the
        # server-level ones (nginx add_header inheritance). Keep in sync above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://*.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), usb=(), payment=(), interest-cohort=()" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri =404;
    }

    # The Web-Push service worker must revalidate on every update check —
    # a long-cached sw.js would strand old push handlers on clients.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        # Repeat the security headers — this block's add_header voids the
        # server-level ones (nginx add_header inheritance). Keep in sync above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://*.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), usb=(), payment=(), interest-cohort=()" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri =404;
    }

    # ---- SPA route allowlist: the only paths that get a 200 -----------------
    # A client-routed SPA has no server-side route table, so the usual
    # `try_files $uri $uri/ /index.html` answers HTTP 200 to EVERY path that
    # ever existed or never did. That is a soft 404: /doesnt-exist,
    # /wp-login.php and /?ref=spam all return the homepage with a success
    # status, and a crawler reads that as "this site has unlimited pages, all
    # duplicates of /". It also hides real broken links from monitoring, since
    # nothing in the logs is an error.
    #
    # So: paths whose FIRST segment is a known route below render the app with
    # 200. Everything else still renders the app (React's NotFound page —
    # src/pages/NotFound.jsx — so a human gets a real page with navigation,
    # not an nginx stock error), but with a genuine 404 status, via
    # `try_files ... =404` falling through to `error_page 404 /index.html`
    # at the bottom of this server block. nginx preserves the 404 status
    # across that internal redirect (only `error_page 404 =200 ...` would
    # rewrite it), which is precisely the behaviour we want.
    #
    # This list IS brittle — it duplicates knowledge that lives in
    # src/App.jsx, and a new route added there without a matching entry here
    # would 404 in production while working perfectly in `npm run dev`. That
    # is exactly why src/nginxRoutes.test.js parses this regex out of this
    # file, parses every path="..." out of App.jsx, and fails CI if App.jsx
    # knows a first segment this list does not. Add routes in both places, or
    # the test tells you which one you forgot.
    #
    # The leading `$` alternative is the site root "/" itself. Each name is
    # followed by (?:/|$) so /credit and /credit/anything match but
    # /credit-card-scam does not.
    #
    # Segments, and where they come from in App.jsx:
    #   driver public   map terms charging-credit-terms privacy refunds contact
    #   driver private  session credit activity groups account
    #   legacy aliases  topup wallet history
    #   auth            login signup forgot-password reset-password
    #                   verify-email auth (the /auth/google/callback landing)
    #   console/admin   cpo admin  (whole subtrees; also the driver-origin
    #                   ExternalRedirect stubs that bounce to cpo.amphive.app)
    location ~ ^/(?:$|(?:account|activity|admin|auth|charging-credit-terms|contact|cpo|credit|forgot-password|groups|history|login|map|privacy|refunds|reset-password|session|signup|terms|topup|verify-email|wallet)(?:/|$)) {
        # index.html (and the SPA fallback) must always revalidate
        # (ETag/304): with no Cache-Control header at all, browsers apply
        # heuristic caching and phones keep launching a stale bundle for
        # days after a deploy.
        add_header Cache-Control "no-cache";
        # Repeat the security headers — this block's add_header voids the
        # server-level ones (nginx add_header inheritance). This is the HTML
        # document response, so CSP + X-Frame-Options matter most here. Keep in
        # sync above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://*.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), usb=(), payment=(), interest-cohort=()" always;
        add_header X-Robots-Tag $robots_tag always;
        # Serve the shell directly — a known app route is never a file on
        # disk, and checking $uri first would let an uploaded/leftover file
        # under one of these names shadow a real route.
        try_files /index.html =404;
    }

    location / {
        # Same no-cache reasoning as the allowlist location above.
        add_header Cache-Control "no-cache";
        # Repeat the security headers — this block's add_header voids the
        # server-level ones (nginx add_header inheritance). Keep in sync above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://*.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), usb=(), payment=(), interest-cohort=()" always;
        add_header X-Robots-Tag $robots_tag always;
        # Real files first (favicon.svg, robots.txt, sitemap.xml,
        # og-image.png, manifest.webmanifest, the icons) — those are served
        # normally with 200. Anything else is an unknown path: `=404` instead
        # of the old `/index.html` fallback, so error_page below serves the
        # SPA shell with a 404 status rather than a 200.
        try_files $uri $uri/ =404;
    }

    # Renders the React app (which routes to pages/NotFound.jsx) as the body of
    # a 404. WITHOUT an `=200` override the original status is preserved, so
    # the client gets the right status AND a usable page.
    error_page 404 /index.html;
}
