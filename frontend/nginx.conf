server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DoS hardening: explicit request-body cap so the limit is documented
    # here rather than relying on nginx's undeclared compiled-in ~1 MB
    # default. Mirrors backend/main.py's MAX_REQUEST_BODY_BYTES (1 MB) —
    # this is the defense-in-depth layer in front of it; a request that
    # bypasses this proxy (e.g. hitting the backend's :8000 debug port
    # directly) still hits the app-layer check.
    client_max_body_size 1m;

    # Security response headers on EVERY deploy path — not only behind the relay
    # Caddy (docker-compose.tls.yml / relay), but also the plain-HTTP
    # docker-compose.prod.yml -NoTls path and any self-hoster who puts their own
    # proxy in front. The CSP is copied VERBATIM from
    # deploy/relay/deploy-relay.sh (razorpay script/frame-src, 'unsafe-inline'
    # styles, self-hosted data: fonts, wss: websockets) — keep the two in sync.
    #
    # Coexistence with Caddy: for the primary domains, Caddy's own `header`
    # block SETS (replaces) these same values, so there is exactly one CSP per
    # response — no duplication. For the bare-http Caddy site and non-Caddy
    # deploys, these nginx headers are the source of truth.
    #
    # nginx add_header inheritance gotcha: a `location` that declares ANY
    # add_header DROPS all inherited ones. The three static locations below (/,
    # /assets/, = /sw.js) set Cache-Control, so this block is repeated verbatim
    # inside each of them. Keep all four copies identical. `always` emits the
    # header even on error (4xx/5xx) responses.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://*.razorpay.com; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API requests to the FastAPI backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # [Firmware upload] The one endpoint that legitimately carries a >1m
    # body: a raw signed OTA image (~1-2 MB; the OTA app partition allows up
    # to 1.9 MB). 8m here so the backend's own tighter caps (4 MiB middleware
    # carve-out + endpoint re-check, see backend/main.py
    # FIRMWARE_UPLOAD_MAX_BYTES) produce the user-facing 413, not an opaque
    # nginx error page.
    location = /api/admin/firmware-releases/upload {
        client_max_body_size 8m;
        proxy_pass http://backend:8000/api/admin/firmware-releases/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.io WebSocket connections
    location /socket.io/ {
        proxy_pass http://backend:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Vite content-hashes everything under /assets/ (index-<hash>.js/.css),
    # so these are safe to cache forever — a new build ships new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repeat the security headers — this block's add_header voids the
        # server-level ones (nginx add_header inheritance). Keep in sync above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://*.razorpay.com; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # The Web-Push service worker must revalidate on every update check —
    # a long-cached sw.js would strand old push handlers on clients.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        # Repeat the security headers — this block's add_header voids the
        # server-level ones (nginx add_header inheritance). Keep in sync above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://*.razorpay.com; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        # index.html (and the SPA fallback) must always revalidate
        # (ETag/304): with no Cache-Control header at all, browsers apply
        # heuristic caching and phones keep launching a stale bundle for
        # days after a deploy.
        add_header Cache-Control "no-cache";
        # Repeat the security headers — this block's add_header voids the
        # server-level ones (nginx add_header inheritance). This is the HTML
        # document response, so CSP + X-Frame-Options matter most here. Keep in
        # sync above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://*.razorpay.com; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
