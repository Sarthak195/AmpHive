server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DoS hardening: explicit request-body cap so the limit is documented
    # here rather than relying on nginx's undeclared compiled-in ~1 MB
    # default. Mirrors backend/main.py's MAX_REQUEST_BODY_BYTES (1 MB) —
    # this is the defense-in-depth layer in front of it; a request that
    # bypasses this proxy (e.g. hitting the backend's :8000 debug port
    # directly) still hits the app-layer check.
    client_max_body_size 1m;

    # Proxy API requests to the FastAPI backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # [Firmware upload] The one endpoint that legitimately carries a >1m
    # body: a raw signed OTA image (~1-2 MB; the OTA app partition allows up
    # to 1.9 MB). 8m here so the backend's own tighter caps (4 MiB middleware
    # carve-out + endpoint re-check, see backend/main.py
    # FIRMWARE_UPLOAD_MAX_BYTES) produce the user-facing 413, not an opaque
    # nginx error page.
    location = /api/admin/firmware-releases/upload {
        client_max_body_size 8m;
        proxy_pass http://backend:8000/api/admin/firmware-releases/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.io WebSocket connections
    location /socket.io/ {
        proxy_pass http://backend:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Vite content-hashes everything under /assets/ (index-<hash>.js/.css),
    # so these are safe to cache forever — a new build ships new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The Web-Push service worker must revalidate on every update check —
    # a long-cached sw.js would strand old push handlers on clients.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        # index.html (and the SPA fallback) must always revalidate
        # (ETag/304): with no Cache-Control header at all, browsers apply
        # heuristic caching and phones keep launching a stale bundle for
        # days after a deploy.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
